name: CI

# On every pull request, and on demand for any branch.
#
# What this proves that a local `make check` cannot: the tests still pass on a
# machine with no coding CLI installed. That is easy to break and hard to notice
# on your own machine, because your machine has the CLI. `make check-fresh` is
# the local approximation; this is the real thing.
#
# It runs per pull request rather than per commit, and a new push cancels the
# run it superseded, so a branch costs about a minute of runner time however
# many times it is pushed. Standard runners are free for a public repository.
#
# workflow_dispatch stays for a clean-machine second opinion on a branch with no
# pull request open:
#   gh workflow run ci.yml --ref <branch>
on:
  pull_request:
  workflow_dispatch:

# One run per pull request. Pushing again cancels the run for the commit nobody
# is waiting on any more; a dispatched run is keyed on its ref instead, so two
# branches never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # There is no third-party dependency, so there is no go.sum and
          # nothing to cache.
          cache: false

      # No coding CLI is installed here, deliberately: a fresh clone must pass
      # its tests without one. If that ever stops being true, this job is where
      # it should be caught.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: go build ./...

  secrets:
    name: no committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every relay connector URL is a live credential. Placeholders are fine;
      # anything that looks like a real secret is not. This is a backstop for
      # the .gitignore, not a replacement for it.
      #
      # The shapes and the allow-list are .githooks/lib.sh, which the hooks read
      # too — a third copy here is a third copy that drifts.
      - name: scan for connector secrets
        run: |
          if ! git ls-files -z | xargs -0 scripts/scan-secrets.sh; then
            echo
            echo "A connector-shaped secret was found in a tracked file."
            . .githooks/lib.sh && echo "$PLACEHOLDER_HINT"
            exit 1
          fi
          echo "no credential-shaped strings in tracked files"
